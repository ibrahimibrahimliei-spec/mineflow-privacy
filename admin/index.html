<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-S5BA+EdkmzAR3mxNnIOjiS+sXr1FX3nidurwAYpmqns=' https://accounts.google.com/gsi/client; style-src 'unsafe-inline' https://accounts.google.com/gsi/style; connect-src https://firestore.googleapis.com https://firebaseremoteconfig.googleapis.com https://firebaserules.googleapis.com https://fcm.googleapis.com https://analyticsdata.googleapis.com https://analyticsadmin.googleapis.com https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; img-src data:; base-uri 'none'; form-action 'none'">
<title>Mine Flow İdarə</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 2h48l6 6v48l-6 6H8l-6-6V8z' fill='%232E2925'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle'%3E%E2%9B%8F%3C/text%3E%3C/svg%3E">
<style>
/* The admin panel in the game's own look ("Mədən fənəri", docs/STYLE.md): dark stone, amber for the main decision,
   copper edges, crystal blue for links and info, mine green for what gives, red only for what cannot be undone. */
:root {
  --stone: #2E2925; --stone2: #453D36; --stone3: #5C5148; --deep: #1F1B18; --line: #6B5D52;
  --amber: #FFB23E; --amber2: #F08A12; --copper: #C46A3A; --copper2: #8E4522;
  --blue: #4FC3E8; --blue2: #1F86B8; --green: #5DBB4A; --green2: #2F7D22; --red: #D8432F;
  --sand: #F4E6C8; --ink: #3B2A1C; --text: #F4E6C8; --muted: #BFAE97;
  --cut: 8px; --cut-l: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--deep); color: var(--text); font: 15px/1.45 Nunito, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
body { min-height: 100vh; }
a { color: var(--blue); }
h1, h2, h3 { font-family: "Lilita One", "Segoe UI Black", system-ui, sans-serif; font-weight: 800; letter-spacing: .3px; margin: 0 0 8px; color: var(--amber); text-shadow: 0 0 14px rgba(255, 178, 62, .25); }
h1 { font-size: 24px; } h2 { font-size: 19px; } h3 { font-size: 16px; }
.muted { color: var(--muted); } .tiny { font-size: 12px; } .small { font-size: 13px; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
.ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--amber); } .info { color: var(--blue); }
.cut { clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); }
[hidden] { display: none !important; }

/* sign-in gate */
.gate { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at 50% 0, rgba(255, 178, 62, .18), transparent 60%), var(--deep); }
.gate-card { width: min(460px, 100%); background: var(--stone); border: 2px solid var(--copper2); padding: 24px 22px; clip-path: polygon(var(--cut-l) 0, calc(100% - var(--cut-l)) 0, 100% var(--cut-l), 100% calc(100% - var(--cut-l)), calc(100% - var(--cut-l)) 100%, var(--cut-l) 100%, 0 calc(100% - var(--cut-l)), 0 var(--cut-l)); }
.gate-card .btn { width: 100%; margin-top: 8px; }
.brand { font-family: "Lilita One", "Segoe UI Black", system-ui, sans-serif; font-size: 24px; color: var(--amber); display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.brand small { font-family: inherit; font-size: 13px; color: var(--copper); text-transform: uppercase; letter-spacing: 2px; }
.brand.small { font-size: 18px; margin: 0; }
.lamp { width: 14px; height: 14px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 12px 4px rgba(255, 178, 62, .55); flex: none; }

/* layout */
.app { display: grid; grid-template-columns: 236px 1fr; grid-template-rows: auto 1fr; min-height: 100vh; }
.side { grid-row: 1 / 3; background: var(--stone); border-right: 2px solid var(--copper2); padding: 16px 12px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.side nav { display: flex; flex-direction: column; gap: 3px; }
.side nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; color: var(--text); text-decoration: none; border-left: 3px solid transparent; font-weight: 700; }
.side nav a:hover { background: var(--stone2); }
.side nav a.on { background: var(--stone2); border-left-color: var(--amber); color: var(--amber); }
.side nav a .badge { margin-left: auto; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.who { font-size: 13px; word-break: break-all; }
.top { display: none; }
.main { padding: 22px 26px 60px; min-width: 0; outline: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 30; transform: translateX(-105%); transition: transform .2s; height: 100vh; }
  .app.menu .side { transform: none; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .5); }
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--stone); border-bottom: 2px solid var(--copper2); position: sticky; top: 0; z-index: 20; }
  .top-title { margin-left: auto; color: var(--muted); font-size: 13px; }
  .main { padding: 16px 16px 60px; }
}

/* blocks */
.page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.page-head h1 { margin: 0; }
.page-head .grow { flex: 1; }
.card { background: var(--stone); border: 1px solid var(--line); padding: 14px 16px; margin-bottom: 14px; position: relative; }
.card > h2:first-child, .card > h3:first-child { margin-top: 0; }
.card.sand { background: var(--sand); color: var(--ink); border-color: var(--copper); }
.card.sand h3 { color: var(--copper2); text-shadow: none; }
.sub { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--copper); font-weight: 800; margin: 12px 0 6px; }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--stone); border: 1px solid var(--line); border-top: 3px solid var(--copper); padding: 10px 12px; }
.kpi b { display: block; font-size: 24px; font-family: "Lilita One", system-ui, sans-serif; color: var(--sand); }
.kpi span { font-size: 12.5px; color: var(--muted); }
.kpi.good { border-top-color: var(--green); } .kpi.hot { border-top-color: var(--amber); } .kpi.blue { border-top-color: var(--blue); } .kpi.red { border-top-color: var(--red); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.end { justify-content: flex-end; }
.stack > * + * { margin-top: 8px; }
.sep { height: 1px; background: var(--line); margin: 12px 0; border: 0; }

/* buttons: one gold per view, green gives, stone is secondary, red cannot be undone */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; cursor: pointer; font: inherit; font-weight: 800; color: #fff; background: linear-gradient(var(--green), var(--green2)); padding: 9px 16px; min-height: 38px; text-decoration: none; clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); }
.btn:hover { filter: brightness(1.08); } .btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; filter: none; transform: none; }
.btn.gold { background: linear-gradient(#FFD27A, var(--amber) 45%, var(--amber2)); color: var(--ink); }
.btn.alt { background: var(--stone3); color: var(--text); }
.btn.blue { background: linear-gradient(var(--blue), var(--blue2)); }
.btn.danger { background: linear-gradient(#E8604C, var(--red)); }
.btn.sm { padding: 5px 10px; min-height: 30px; font-size: 13px; }
.btn.ghost { background: transparent; color: var(--blue); padding: 4px 6px; min-height: 0; clip-path: none; text-decoration: underline; }
.btn.busy { pointer-events: none; opacity: .7; }
.btn.busy::after { content: ''; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* forms */
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 700; min-width: 0; }
label.f.inline { flex-direction: row; align-items: center; gap: 8px; }
input, select, textarea { font: inherit; color: var(--text); background: var(--deep); border: 1px solid var(--line); padding: 8px 10px; min-height: 38px; width: 100%; min-width: 0; }
input[type=checkbox], input[type=radio] { width: 18px; height: 18px; min-height: 0; accent-color: var(--amber); flex: none; }
input:focus, select:focus, textarea:focus, .btn:focus-visible, a:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
textarea { min-height: 70px; resize: vertical; }
textarea.code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; min-height: 120px; }
input.changed, textarea.changed, select.changed { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }
input.err, textarea.err { border-color: var(--red); box-shadow: 0 0 0 1px var(--red) inset; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.fields.wide { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.langs { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.search { display: flex; gap: 8px; }
.search input { flex: 1; }
.hint { font-size: 12.5px; color: var(--muted); }

/* tables */
.tbl-wrap { overflow-x: auto; margin: 0 -2px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--stone2); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--copper); font-weight: 800; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--stone2); }
tr.flag td { background: rgba(216, 67, 47, .12); }
tr.me td { background: rgba(255, 178, 62, .1); }

/* chips, badges, toggles */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; font-size: 12px; font-weight: 800; background: var(--stone3); color: var(--text); clip-path: polygon(5px 0, calc(100% - 5px) 0, 100% 5px, 100% calc(100% - 5px), calc(100% - 5px) 100%, 5px 100%, 0 calc(100% - 5px), 0 5px); white-space: nowrap; }
.chip.green { background: var(--green2); } .chip.red { background: var(--red); } .chip.amber { background: var(--amber2); color: var(--ink); } .chip.blue { background: var(--blue2); } .chip.copper { background: var(--copper2); }
.chip button { background: none; border: 0; color: inherit; cursor: pointer; padding: 0 0 0 2px; font: inherit; }
.badge { background: var(--red); color: #fff; font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 9px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; border-bottom: 2px solid var(--stone2); }
.tabs button { background: none; border: 0; color: var(--muted); font: inherit; font-weight: 800; padding: 8px 12px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tabs button.on { color: var(--amber); border-bottom-color: var(--amber); }
.switch { position: relative; width: 46px; height: 26px; flex: none; }
.switch input { opacity: 0; position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--stone3); border-radius: 13px; transition: background .15s; }
.switch span::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--sand); transition: transform .15s; }
.switch input:checked + span { background: var(--green); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--amber); }
.feat { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--stone2); }
.feat .t { flex: 1; min-width: 0; }
.feat .t b { display: block; }

/* tree editor (Remote Config cfg) */
details.grp { background: var(--stone); border: 1px solid var(--line); margin-bottom: 8px; }
details.grp > summary { cursor: pointer; padding: 10px 14px; font-weight: 800; color: var(--amber); list-style: none; display: flex; gap: 8px; align-items: center; }
details.grp > summary::before { content: '▸'; color: var(--copper); }
details.grp[open] > summary::before { content: '▾'; }
details.grp > .grp-body { padding: 4px 14px 12px; }
.leaf { display: grid; grid-template-columns: minmax(150px, 1.2fr) minmax(120px, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--stone2); }
.leaf .k { font-weight: 700; word-break: break-word; }
.leaf .k small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.leaf .md { display: flex; gap: 6px; }
@media (max-width: 600px) { .leaf { grid-template-columns: 1fr auto; } .leaf .k { grid-column: 1 / -1; } }

/* modal and toasts */
.modal { position: fixed; inset: 0; background: rgba(10, 8, 6, .72); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal-card { width: min(760px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: var(--stone); border: 2px solid var(--copper2); clip-path: polygon(var(--cut-l) 0, calc(100% - var(--cut-l)) 0, 100% var(--cut-l), 100% calc(100% - var(--cut-l)), calc(100% - var(--cut-l)) 100%, var(--cut-l) 100%, 0 calc(100% - var(--cut-l)), 0 var(--cut-l)); }
.modal-card.wide { width: min(1000px, 100%); }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 6px; }
.modal-head h2 { flex: 1; margin: 0; }
.modal-head .x { background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; }
.modal-body { padding: 6px 18px 12px; overflow-y: auto; }
.modal-btns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 10px 18px 16px; border-top: 1px solid var(--stone2); }
.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: calc(100vw - 32px); }
.toast { background: var(--stone2); border-left: 4px solid var(--green); padding: 10px 14px; box-shadow: 0 6px 20px rgba(0, 0, 0, .4); max-width: 420px; animation: tin .2s; }
.toast.bad { border-left-color: var(--red); } .toast.warn { border-left-color: var(--amber); }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }

/* small pieces */
.kv { display: grid; grid-template-columns: minmax(120px, auto) 1fr; gap: 4px 14px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-word; }
.bar { height: 10px; background: var(--stone2); position: relative; min-width: 60px; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--amber); }
.bar.green i { background: var(--green); } .bar.blue i { background: var(--blue); } .bar.red i { background: var(--red); }
.diff { font-family: ui-monospace, Consolas, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; background: var(--deep); padding: 8px; max-height: 50vh; overflow: auto; }
.diff .a { color: var(--green); background: rgba(93, 187, 74, .1); display: block; } .diff .d { color: #ff8f80; background: rgba(216, 67, 47, .12); display: block; }
.empty { color: var(--muted); padding: 18px; text-align: center; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps li { counter-increment: s; padding: 8px 0 8px 38px; position: relative; border-bottom: 1px solid var(--stone2); }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 7px; width: 26px; height: 26px; display: grid; place-items: center; background: var(--copper2); color: var(--sand); font-weight: 800; clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
.steps li.done::before { content: '✓'; background: var(--green2); }
.preview { background: var(--sand); color: var(--ink); padding: 14px; border: 2px solid var(--copper); max-width: 340px; }
.preview h4 { margin: 0 0 6px; font-family: "Lilita One", system-ui, sans-serif; color: var(--copper2); }
.preview .rws { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.preview .rws span { background: #fff8e8; border: 1px solid var(--copper); padding: 2px 8px; font-weight: 800; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-size: 11px; }
svg.chart .grid line { stroke: var(--stone2); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: 5px; }
.gantt { overflow-x: auto; }
.gantt-in { display: grid; gap: 3px 0; min-width: 720px; font-size: 12px; }
.gantt .lbl { position: sticky; left: 0; background: var(--stone); padding: 3px 8px 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 1; }
.gantt .seg { height: 20px; margin-top: 2px; background: var(--copper); color: #fff; padding: 2px 6px; overflow: hidden; white-space: nowrap; font-weight: 700; font-size: 11px; clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 50%, calc(100% - 4px) 100%, 4px 100%, 0 50%); }
.gantt .day { color: var(--muted); font-size: 10px; text-align: center; border-left: 1px solid var(--stone2); }
.gantt .day.mon { color: var(--sand); border-left-color: var(--stone3); }
.gantt .day.today { color: var(--amber); font-weight: 800; }
.loading { display: flex; align-items: center; gap: 8px; color: var(--muted); padding: 14px 0; }
.loading::before { content: ''; width: 14px; height: 14px; border: 2px solid var(--amber); border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
</style>
</head>
<body>
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="brand"><span class="lamp"></span>Mine Flow <small>idarə paneli</small></div>
    <p id="gateText" class="muted">Yüklənir…</p>
    <div id="gateBody"></div>
  </div>
</div>
<div id="app" class="app" hidden>
  <aside class="side" id="side">
    <div class="brand small"><span class="lamp"></span>Mine Flow <small>idarə</small></div>
    <nav id="nav" aria-label="Bölmələr"></nav>
    <div class="side-foot">
      <div id="who" class="who"></div>
      <div id="reads" class="muted tiny"></div>
      <button class="btn alt sm" id="signOut" type="button">Çıxış</button>
    </div>
  </aside>
  <header class="top">
    <button class="btn alt sm" id="menuBtn" type="button" aria-label="Menyu">☰</button>
    <div class="brand small"><span class="lamp"></span>Mine Flow</div>
    <div id="topTitle" class="top-title"></div>
  </header>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card">
    <div class="modal-head"><h2 id="modalTitle"></h2><button class="x" id="modalX" type="button" aria-label="Bağla">✕</button></div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalBtns" class="modal-btns"></div>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="https://accounts.google.com/gsi/client" async></script>

e for a finished country (with its town souvenir)","winter.box.adDaily":"missed days' boxes a player may open with a rewarded ad per day (today's box is always free)","winter.box.gifts":"day k of the event gets gifts[k % 7]","winter.box.big":"the big days' gifts in place of the normal one","winter.caravan.visits":"Şaxta baba comes once inside each hour range (the same hour for everyone on a date) and stays stay hours; he comes once the houses are open in the town",".stay":"Şaxta baba comes once inside each hour range (the same hour for everyone on a date) and stays stay hours; he comes once the houses are open in the town","winter.caravan.free":"the free sack and the rewarded-ad sack of each visit, picked by weight",".ad":"the free sack and the rewarded-ad sack of each visit, picked by weight","winter.caravan.trade":"the trade sack: one trade picked at random each visit","winter.pass.need":"snowflakes earned in the event that open tier k","winter.pass.free":"the tier rewards (the decorations and the frost paint stay as the code has them)",".prem":"the tier rewards (the decorations and the frost paint stay as the code has them)","inbox.profileMin":"minutes between two profile summaries while something changes (also once a start, a 6-hour refresh, and when the game goes to the background)","inbox.pollMin":"how often the game looks for new letters, broadcasts and a ban while it runs (always at the start and when the player comes back)"},"rules":"rules_version = '2';\n// Mine Flow (phase 10). Every player signs in anonymously (Firebase Authentication); a player writes only documents\n// keyed by their own auth uid. Deploy: firebase deploy --only firestore:rules (RELEASE.md, \"Firebase: Firestore\").\n// 1.0.10: a player may delete every document of their own (\"Delete my account\", Play's account deletion rule).\n// 1.1: the admin panel (admin/index.html) reads and writes as the project's owner with a Google OAuth token: such\n// requests are checked by Google Cloud IAM, not by these rules, so nothing below opens anything to the panel. What the\n// panel writes, players only read (inbox, broadcasts, bans); a ban keeps a player out of every leaderboard (notBanned).\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    function me(uid) { return request.auth != null && request.auth.uid == uid; }\n    // 1.1: bans/{uid} written by the admin panel: no more leaderboard writes (the game stops them too, bridge.js)\n    function notBanned() { return !exists(/databases/$(database)/documents/bans/$(request.auth.uid)); }\n\n    // weekly tournament boards: boards/{board}/entries/{uid} = { pid, name, country, level, score, at }\n    // the score only goes up and never above the tournament maximum (10 levels x 1000 points, CFG.tour)\n    match /boards/{board}/entries/{uid} {\n      allow read: if request.auth != null;\n      allow create: if me(uid) && request.resource.data.score is int && request.resource.data.score >= 0\n        && request.resource.data.score \u003c= 10000 && request.resource.data.name is string && request.resource.data.name.size() \u003c= 16 && notBanned();\n      allow update: if me(uid) && request.resource.data.score is int && request.resource.data.score >= resource.data.score\n        && request.resource.data.score \u003c= 10000 && request.resource.data.name is string && request.resource.data.name.size() \u003c= 16 && notBanned();\n      allow delete: if me(uid);\n    }\n\n    // the weekly country race: races/{week}/players/{uid_iso} = { iso, rocks, at }. A player adds only their own\n    // rocks, at most 3000 a write and 200000 a week; the country is part of the id, so points stay with the country\n    // they were earned for. FCM tokens for remote push sit in players/{uid} (only the owner reads or writes them).\n    match /races/{week}/players/{id} {\n      allow read: if request.auth != null;\n      allow create: if request.auth != null && id == request.auth.uid + '_' + request.resource.data.iso\n        && request.resource.data.rocks is int && request.resource.data.rocks >= 0 && request.resource.data.rocks \u003c= 3000 && notBanned();\n      allow update: if request.auth != null && id == request.auth.uid + '_' + resource.data.iso\n        && request.resource.data.iso == resource.data.iso && request.resource.data.rocks is int\n        && request.resource.data.rocks >= resource.data.rocks && request.resource.data.rocks - resource.data.rocks \u003c= 3000\n        && request.resource.data.rocks \u003c= 200000 && notBanned();\n      allow delete: if request.auth != null && id.matches(request.auth.uid + '_[A-Z]{2}');\n    }\n\n    // invite codes: invites/{code}/friends/{uid} = { level, at }: a new player registers under the friend's code\n    // and moves their level up; the inviter reads the list to collect rewards (CFG.invite)\n    match /invites/{code}/friends/{uid} {\n      allow read: if request.auth != null;\n      allow create: if me(uid) && request.resource.data.level is int && request.resource.data.level \u003c= 200;\n      allow update: if me(uid) && request.resource.data.level is int && request.resource.data.level >= resource.data.level && request.resource.data.level \u003c= 200;\n      allow delete: if me(uid);\n    }\n\n    // unique player names: names/{key} = { uid, name, at }; key = the name folded (nameKey in web/game.html). The\n    // first player to create a key holds it; nobody can take it over, only its holder lets it go (a rename)\n    match /names/{key} {\n      allow get: if request.auth != null;\n      allow create: if request.auth != null && request.resource.data.uid == request.auth.uid\n        && key.size() >= 2 && key.size() \u003c= 64 && request.resource.data.name is string\n        && request.resource.data.name.size() >= 3 && request.resource.data.name.size() \u003c= 16;\n      allow delete: if request.auth != null && (resource == null || resource.data.uid == request.auth.uid);\n      allow list, update: if false;\n    }\n\n    match /players/{uid} {\n      allow read, write: if me(uid);\n    }\n\n    // 1.0.5: the global ranking. ranking/{uid} = { name, iso, won, ach, tour, at } and the monthly board\n    // rankMonth/{yyyy-mm}/players/{uid} = { name, iso, won, at }. won = levels won (first clears): it never goes down and\n    // grows by at most 80 a day since the last write. at = the phone's clock in ms when written, which must be within\n    // 10 minutes of the server's (request.time), so an old `at` cannot be faked to allow a bigger jump.\n    function now10(at) { return at is number && at > request.time.toMillis() - 600000 && at \u003c request.time.toMillis() + 600000; }\n    function rankBase(d) {\n      return d.name is string && d.name.size() >= 1 && d.name.size() \u003c= 20 && d.iso is string && d.iso.matches('^[A-Z]{2}$')\n        && d.won is number && d.won >= 0 && now10(d.at);\n    }\n    function grows(old, d) { return d.won >= old.won && d.won - old.won \u003c= 80 + 80 * (request.time.toMillis() - old.at) / 86400000; }\n    // 1.1: wonAt (optional; older versions leave it out) = when won last grew, the tie-break (first there ranks higher).\n    // Never in the future, and kept as it was while won stays the same, so an earlier time cannot be claimed later\n    function wonAtOk(d) { return !('wonAt' in d) || (d.wonAt is number && d.wonAt > 0 && d.wonAt \u003c= request.time.toMillis() + 600000); }\n    function wonAtKept(old, d) { return !('wonAt' in d) || !('wonAt' in old) || d.won > old.won || d.wonAt == old.wonAt; }\n    match /ranking/{uid} {\n      allow read: if request.auth != null;\n      allow create: if me(uid) && rankBase(request.resource.data) && request.resource.data.won \u003c= 1000\n        && request.resource.data.ach is number && request.resource.data.tour is number\n        && wonAtOk(request.resource.data) && request.resource.data.keys().hasOnly(['name', 'iso', 'won', 'wonAt', 'ach', 'tour', 'at']) && notBanned();\n      allow update: if me(uid) && rankBase(request.resource.data) && grows(resource.data, request.resource.data)\n        && request.resource.data.ach is number && request.resource.data.tour is number\n        && wonAtOk(request.resource.data) && wonAtKept(resource.data, request.resource.data)\n        && request.resource.data.keys().hasOnly(['name', 'iso', 'won', 'wonAt', 'ach', 'tour', 'at']) && notBanned();\n      allow delete: if me(uid);\n    }\n    // a month's board: its first write holds at most 80 a day of the month so far (request.time.day(): 1-31)\n    match /rankMonth/{month}/players/{uid} {\n      allow read: if request.auth != null;\n      allow create: if me(uid) && month.matches('^20[0-9]{2}-[01][0-9]$') && rankBase(request.resource.data)\n        && request.resource.data.won \u003c= 80 * request.time.day() && wonAtOk(request.resource.data) && request.resource.data.keys().hasOnly(['name', 'iso', 'won', 'wonAt', 'at']) && notBanned();\n      allow update: if me(uid) && rankBase(request.resource.data) && grows(resource.data, request.resource.data)\n        && wonAtOk(request.resource.data) && wonAtKept(resource.data, request.resource.data)\n        && request.resource.data.keys().hasOnly(['name', 'iso', 'won', 'wonAt', 'at']) && notBanned();\n      allow delete: if me(uid);\n    }\n\n    // 1.0.8: the 24-hour dig race and the town build race (B + its start day). digs/{day}-g{group}/players/{uid} = { name, iso, rocks, at }; day = the UTC date\n    // (yyyymmdd). Today's rocks only go up, at most 3000 a write and 100000 a day; at within 10 minutes of the server\n    match /digs/{board}/players/{uid} {\n      allow read: if request.auth != null;\n      allow create: if me(uid) && board.matches('^B?20[0-9]{6}-g[0-9]{1,6}$') && request.resource.data.rocks is int\n        && request.resource.data.rocks >= 0 && request.resource.data.rocks \u003c= 3000 && digBase(request.resource.data) && notBanned();\n      allow update: if me(uid) && request.resource.data.rocks is int && request.resource.data.rocks >= resource.data.rocks\n        && request.resource.data.rocks - resource.data.rocks \u003c= 3000 && request.resource.data.rocks \u003c= 100000 && digBase(request.resource.data) && notBanned();\n      allow delete: if me(uid);\n    }\n    function digBase(d) {\n      return d.name is string && d.name.size() \u003c= 16 && d.iso is string && d.iso.matches('^[A-Z]{2}$') && now10(d.at)\n        && d.keys().hasOnly(['name', 'iso', 'rocks', 'at']);\n    }\n    // 1.0.8: cheers in the ranking: cheers/{to}/from/{from} = { e, name, day, at }: a preset emoji (index 0-9, no free\n    // text); the sender writes only their own document, once a day per player (day changes); the receiver reads them\n    match /cheers/{to}/from/{from} {\n      allow read: if me(to);\n      allow create, update: if me(from) && from != to && request.resource.data.e is int && request.resource.data.e >= 0\n        && request.resource.data.e \u003c= 9 && request.resource.data.name is string && request.resource.data.name.size() \u003c= 16\n        && request.resource.data.day is string && now10(request.resource.data.at)\n        && request.resource.data.keys().hasOnly(['e', 'name', 'day', 'at'])\n        && (resource == null || resource.data.day != request.resource.data.day);\n      allow delete: if me(to) || me(from);\n    }\n\n    // 1.0.8: achievement rarity: achv/{id}/p/{uid} = { k, at }: the tiers a player reached (1-3, never down); everyone\n    // signed in counts them\n    match /achv/{id}/p/{uid} {\n      allow read: if request.auth != null;\n      allow create: if me(uid) && id.size() \u003c= 32 && request.resource.data.k is int && request.resource.data.k >= 1 && request.resource.data.k \u003c= 3\n        && now10(request.resource.data.at) && request.resource.data.keys().hasOnly(['k', 'at']);\n      allow update: if me(uid) && request.resource.data.k is int && request.resource.data.k >= resource.data.k && request.resource.data.k \u003c= 3\n        && now10(request.resource.data.at) && request.resource.data.keys().hasOnly(['k', 'at']);\n      allow delete: if me(uid);\n    }\n\n    // ---------- 1.1: the admin panel (admin/index.html) and its side in the game (web/src/js/inbox.js) ----------\n    // profiles/{uid}: the player's short summary for support and statistics; only its owner reads or writes it\n    function profOk(d) {\n      return d.keys().hasOnly(['pid', 'name', 'nk', 'iso', 'lang', 'vc', 'vn', 'store', 'won', 'max', 'plvl', 'c', 'cr', 'crE', 'crS',\n          'pay', 'vip', 'noAds', 'gp', 'first', 'days', 'ban', 'at'])\n        && d.pid is string && d.pid.size() \u003c= 40 && d.name is string && d.name.size() \u003c= 20 && d.nk is string && d.nk.size() \u003c= 64\n        && d.iso is string && d.iso.size() \u003c= 2 && d.lang is string && d.lang.size() \u003c= 5 && d.vn is string && d.vn.size() \u003c= 20\n        && d.store is string && d.store.size() \u003c= 10 && d.ban is string && d.ban.size() \u003c= 10\n        && d.vc is number && d.won is number && d.max is number && d.plvl is number && d.c is number && d.cr is number\n        && d.crE is number && d.crS is number && d.pay is number && d.vip is number && d.noAds is number && d.gp is number\n        && d.first is number && d.days is number && now10(d.at);\n    }\n    match /profiles/{uid} {\n      allow read, delete: if me(uid);\n      allow create, update: if me(uid) && profOk(request.resource.data);\n    }\n    // inbox/{uid}/items/{id}: gifts and messages the panel sent to this player. The player reads them, marks one taken\n    // once (got: when, nothing else changes) and may delete them (account deletion); only the panel creates them\n    match /inbox/{uid}/items/{id} {\n      allow read, delete: if me(uid);\n      allow update: if me(uid) && !('got' in resource.data) && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['got'])\n        && now10(request.resource.data.got);\n    }\n    // broadcasts/{id}: a gift or message to everyone (or an audience). Every player reads them; got/{uid} = { at } notes\n    // who took it (the panel counts them), written once by that player\n    match /broadcasts/{id} {\n      allow read: if request.auth != null;\n      match /got/{uid} {\n        allow create: if me(uid) && request.resource.data.keys().hasOnly(['at']) && now10(request.resource.data.at);\n        allow delete: if me(uid);\n      }\n    }\n    // bans/{uid} and bans/p_{pid} (the game's own player id, kept in the cloud save): the player reads their own\n    match /bans/{id} {\n      allow get: if me(id) || (request.auth != null && id.matches('^p_[A-Za-z0-9_-]{1,60}$'));\n    }\n    // adminLog, adminNotes, adminStats: the panel's own; no rule, so no player reads or writes them\n  }\n}\n","indexes":{"indexes":[{"collectionGroup":"ranking","queryScope":"COLLECTION","fields":[{"fieldPath":"iso","order":"ASCENDING"},{"fieldPath":"won","order":"DESCENDING"}]},{"collectionGroup":"ranking","queryScope":"COLLECTION","fields":[{"fieldPath":"iso","order":"ASCENDING"},{"fieldPath":"won","order":"ASCENDING"}]},{"collectionGroup":"players","queryScope":"COLLECTION","fields":[{"fieldPath":"iso","order":"ASCENDING"},{"fieldPath":"won","order":"ASCENDING"}]}],"fieldOverrides":[]}};

function el(tag, attrs, ...kids) {

// ---------- push notifications (FCM HTTP v1) ----------

const fcmGone = e => e && (e.status === 404 || /UNREGISTERED|registration-token-not-registered|not a valid FCM registration token/i.test((e.message || '') + JSON.stringify(e.details || {})));

    el('div', { class: 'card' }, el('h3', null, 'Yeni bildiriş'), L.node,

        const id = Date.now().toString(36), res = { ok: 0, gone: 0, bad: 0 }, gone = [];

      }))));

  ['weekend', '💰 Bonuslu həftəsonu', '#8E6B22'], ['bc', '📬 Hamıya elan', 'var(--blue2)'], ['brace', '🏗️ Tikinti yarışı', '#2F6E8E'], ['far', '🧭 Uzaq ekspedisiya', '#6B4E9B'],
  ['trip', '✈️ Dünya səyahəti', '#2F7D22'], ['pass', '🎫 MinerPass mövsümü', '#7A5A2E'], ['tour', '🏆 Turnir həftəsi', 'var(--stone3)'], ['month', '📊 Aylıq reytinq', 'var(--stone3)'],
];
const dayStart = ms => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
const addDays = (ms, n) => { const d = new Date(ms); d.setDate(d.getDate() + n); return d.getTime(); };
// every dated thing that overlaps [from, to): [{ key, row, ic, name, start, end, note, edit: [view, arg] }]
function calendarEvents(from = addDays(dayStart(Date.now()), -7), to = addDays(from, 60), bcs = []) {
  const C = cfgEffective(rcCfg()), out = [], hit = (a, b) => b > from && a < to, y0 = new Date(from).getFullYear(), y1 = new Date(to).getFullYear();
  const push = (row, key, ic, name, a, b, note, edit) => { if (hit(a, b)) out.push({ row, key, ic, name, start: a, end: b, note: note || '', edit }); };
  for (const e of C.events.list) for (let y = y0 - 1; y <= y1; y++) {
    const [fm, fd] = e.from, [tm, td] = e.to, wrap = tm < fm || (tm === fm && td < fd);
    push('event', `ev-${e.id}-${y}`, e.ic, EV_AZ[e.id] || e.id, new Date(y, fm - 1, fd).getTime(), new Date(wrap ? y + 1 : y, tm - 1, td + 1).getTime(), 'tədbir səviyyələri və valyutası', ['remote', 'cfg']);
  }
  for (const h of C.holidays) for (let y = y0 - 1; y <= y1; y++) {
    const md = h.on ? h.on[y] : h.from;
    if (!md) continue;
    push('holiday', `hol-${h.id}-${y}`, h.ic, HOL_AZ[h.id] || h.id, new Date(y, md[0] - 1, md[1]).getTime(), new Date(y, md[0] - 1, md[1] + h.days).getTime(), 'dillər: ' + h.langs.join(', ').toUpperCase(), ['remote', 'cfg']);
  }
  // repeating UTC windows from an epoch
  const cycle = (Cc, row, ic, name, note) => {
    const e = Date.parse(Cc.epoch + 'T00:00:00Z');
    if (!Number.isFinite(e)) return;
    const per = Math.max(1, Cc.every) * DAY;
    for (let k = Math.max(0, Math.floor((from - e) / per) - 1); e + k * per < to; k++) { const a = e + k * per; push(row, `${row}-${k}`, ic, typeof name === 'function' ? name(k) : name, a, a + Math.min(Cc.days, Cc.every) * DAY, note, ['remote', 'cfg']); }
  };
  if (featOn('brace')) cycle(C.brace, 'brace', '🏗️', 'Tikinti yarışı', `hər ${C.brace.every} gündən bir, ${C.brace.days} gün`);
  if (featOn('far')) cycle(C.far, 'far', '🧭', k => 'Uzaq ekspedisiya: ' + (PLACE_AZ[C.far.places[k % C.far.places.length]] || C.far.places[k % C.far.places.length]), `${C.far.days} gün, hədəf ${C.far.goal} səfər`);
  if (featOn('pass')) cycle({ epoch: G.pass.epoch, every: G.pass.days, days: G.pass.days }, 'pass', '🎫', 'MinerPass mövsümü', `${G.pass.days} gün`);
  // sale weekends: every second Saturday-Sunday from the epoch (coin packs +bonus)
  if (G.saleWeekend && G.saleWeekend.epoch) {
    const [y, m, d] = G.saleWeekend.epoch, ep = new Date(y, m - 1, d).getTime();
    for (let s = dayStart(from); s < to; s = addDays(s, 1)) {
      const dt = new Date(s);
      if (dt.getDay() !== 6 || ((Math.round((s - ep) / (7 * DAY)) % 2) + 2) % 2 !== 0) continue;
      push('weekend', 'wk-' + s, '💰', `Qəpik paketləri +${Math.round(G.saleWeekend.bonus * 100)}%`, s, addDays(s, 2), 'hər ikinci həftəsonu (kodda)');
    }
  }
  // the world trip: a country opens on its date (the game also needs its pictures)
  if (featOn('trip')) for (const [c, d] of Object.entries((C.trip && C.trip.open) || {})) {
    const [y, m, dd] = String(d).split('-').map(Number), a = new Date(y, m - 1, dd).getTime();
    push('trip', 'trip-' + c, '✈️', 'Açılır: ' + (TRIP_AZ[c] || c), a, addDays(a, 1), 'şəkilləri olan ölkə açılır', ['remote', 'cfg']);
  }
  // tournament weeks (local Monday) and the monthly ranking (crystals for the top 10 when a month ends)
  if (featOn('tournament')) for (let s = weekStartOf(new Date(from)).getTime(); s < to; s = addDays(s, 7)) push('tour', 'tour-' + s, '🏆', 'Turnir ' + weekKey(new Date(s)), s, addDays(s, 7), 'bazar ertəsi yenilənir');
  for (let d = new Date(new Date(from).getFullYear(), new Date(from).getMonth(), 1); d.getTime() < to; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
    const a = d.getTime(), b = new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime();
    push('month', 'm-' + a, '📊', 'Aylıq reytinq: ' + MONTH_AZ[d.getMonth()], a, b, 'ay bitəndə ilk 10-a kristal', ['boards', 'month']);
  }
  // from Remote Config: the news window and the coin sale
  const news = rcJson('news', {}), sale = rcJson('sale', {});
  if (isObj(news) && news.id) push('news', 'news', '📰', 'Xəbər: ' + short(pickLang(news.text), 40), rcTime(news.start) || Date.now(), rcTime(news.end) || to, 'id ' + news.id, ['remote', 'main']);
  if (isObj(sale) && sale.pct) push('sale', 'sale', '🏷️', `Endirim -${sale.pct}%`, rcTime(sale.start) || Date.now(), rcTime(sale.end) || to, (sale.items || []).join(', '), ['remote', 'main']);
  for (const b of bcs) push('bc', 'bc-' + b._id, '📬', short(pickLang(b.title) || pickLang(b.text), 40), b.start || b.at, b.end || to, rwText(b.r), ['gifts']);
  return out.sort((a, b) => a.start - b.start);
}

VIEWS.calendar = async (box, arg) => {
  const span = [30, 60, 90, 180].includes(+arg) ? +arg : 60, from = addDays(dayStart(Date.now()), -7), to = addDays(from, span);
  clear(box, pageHead('📅 Təqvim', el('div', { class: 'row' }, [30, 60, 90, 180].map(n => btn(n + ' gün', n === span ? 'gold sm' : 'alt sm', () => go('calendar', String(n)))))), loading());
  await rcLoad().catch(() => null);
  const bcs = await fsQuery('broadcasts', { order: [['at', 'desc']], limit: 60 }).catch(() => []);
  const list = calendarEvents(from, to, bcs.filter(b => !b.end || b.end > from));
  const days = Math.round((to - from) / DAY), today = dayStart(Date.now());
  const col = ms => Math.max(0, Math.min(days, Math.round((dayStart(ms) - from) / DAY) + (ms - dayStart(ms) > HOUR * 12 ? 1 : 0)));
  const g = el('div', { class: 'gantt-in', style: { gridTemplateColumns: `170px repeat(${days}, minmax(18px, 1fr))` } });
  g.append(el('div', { class: 'lbl muted', style: { gridRow: '1', gridColumn: '1' } }, ''));
  for (let i = 0; i < days; i++) {
    const d = new Date(addDays(from, i));
    g.append(el('div', { class: 'day' + (d.getDay() === 1 ? ' mon' : '') + (dayStart(d) === today ? ' today' : ''), title: fmtDate(d), style: { gridRow: '1', gridColumn: String(i + 2) } }, d.getDate() === 1 ? MONTH_AZ[d.getMonth()].slice(0, 3) : String(d.getDate())));
  }
  let r = 2;
  for (const [row, label, color] of CAL_ROWS) {
    const segs = list.filter(e => e.row === row);
    if (!segs.length) continue;
    g.append(el('div', { class: 'lbl', style: { gridRow: String(r), gridColumn: '1' } }, label));
    for (const e of segs) {
      const a = col(e.start), b = Math.max(a + 1, col(e.end));
      g.append(el('div', { class: 'seg', style: { gridRow: String(r), gridColumn: `${a + 2} / ${b + 2}`, background: color, cursor: e.edit ? 'pointer' : 'default' }, title: `${e.name}\n${fmtTime(e.start)} → ${fmtTime(e.end)}${e.note ? '\n' + e.note : ''}`, onclick: e.edit ? () => go(...e.edit) : null }, `${e.ic} ${e.name}`));
    }
    r++;
  }
  // a line for today
  const ti = Math.round((today - from) / DAY);
  if (ti >= 0 && ti < days) g.append(el('div', { style: { gridRow: `1 / ${r}`, gridColumn: `${ti + 2} / ${ti + 3}`, borderLeft: '2px solid var(--amber)', pointerEvents: 'none', opacity: '.6' } }));
  const now = Date.now(), running = list.filter(e => e.start <= now && e.end > now && !['tour', 'month'].includes(e.row)), next = list.filter(e => e.start > now && !['tour', 'month'].includes(e.row));
  const agenda = l => (l.length ? el('table', null, el('tbody', null, l.map(e => el('tr', { class: e.edit ? 'click' : '', onclick: e.edit ? () => go(...e.edit) : null },
    el('td', null, e.ic), el('td', null, el('b', null, e.name), e.note ? el('div', { class: 'tiny muted' }, e.note) : null),
    el('td', null, `${fmtDate(e.start)} → ${fmtDate(e.end - 1)}`), el('td', { class: 'muted' }, e.start > now ? ago(e.start) : 'bitir ' + ago(e.end)))))) : empty('Yoxdur'));
  clear(box, pageHead('📅 Təqvim', el('div', { class: 'row' }, [30, 60, 90, 180].map(n => btn(n + ' gün', n === span ? 'gold sm' : 'alt sm', () => go('calendar', String(n)))))),
    el('p', { class: 'small muted' }, 'Kodun qaydaları + Remote Config (dərc olunmamış dəyişikliklər də görünür). Zolağa bas: dəyişdirmək üçün açılır. Tarixlər oyunçunun öz saatı ilədir; tikinti yarışı, uzaq ekspedisiya və MinerPass UTC günüdür.'),
    el('div', { class: 'card gantt' }, g),
    el('div', { class: 'grid g2' }, el('div', { class: 'card' }, el('h3', null, '▶ İndi gedir'), agenda(running)), el('div', { class: 'card' }, el('h3', null, '⏭ Gələcək'), agenda(next.slice(0, 25)))));
};
// ---------- the overview page and statistics (Firestore counts, a daily snapshot, Google Analytics 4) ----------
// Counts are aggregation queries (one read per 1000 documents). Once a day the overview keeps a snapshot in
// adminStats/{yyyy-mm-dd} so the panel has its own history. Level analytics come from the game's level_start /
// level_complete / level_fail events in Google Analytics (Firebase Analytics); the level number needs the custom
// dimension "level", which the panel can create.
const ago30 = () => Date.now() - 30 * DAY;
async function countsNow() {
  const n = Date.now(), c = (path, where) => fsCount(path, { where }).catch(() => null);
  const [d1, d7, d30, total, new1, new7, ranking, push, bans] = await Promise.all([
    c('profiles', [W('at', '>=', n - DAY)]), c('profiles', [W('at', '>=', n - 7 * DAY)]), c('profiles', [W('at', '>=', n - 30 * DAY)]), c('profiles'),
    c('profiles', [W('first', '>=', n - DAY)]), c('profiles', [W('first', '>=', n - 7 * DAY)]), c('ranking'), c('players'), c('bans'),
  ]);
  return { d1, d7, d30, total, new1, new7, ranking, push, bans };
}
const kpi = (v, label, cls, onclick) => el('div', { class: 'kpi ' + (cls || ''), style: onclick ? { cursor: 'pointer' } : null, onclick }, el('b', null, v == null ? '—' : num(v)), el('span', null, label));
// today's snapshot, written once a day by whoever opens the overview first
async function snapshot(c) {
  const id = fmtDate(Date.now());
  try {
    if (await fsGet(`adminStats/${id}`)) return;
    const sample = await fsQuery('profiles', { where: [W('at', '>=', Date.now() - DAY)], limit: 1000 }).catch(() => []);
    const by = k => sample.reduce((a, p) => { const v = String(p[k] ?? '?'); a[v] = (a[v] || 0) + 1; return a; }, {});
    await commit([set(`adminStats/${id}`, { at: Date.now(), ...Object.fromEntries(Object.entries(c).filter(([, v]) => v != null)), vc: by('vc'), lang: by('lang'), iso: by('iso'), store: by('store') })], null);
  } catch (e) { console.warn('snapshot', e); }
}

// clean-up: what the privacy page promises ("leaderboard, country race and invite entries are kept for 12 months")
// plus profiles and inboxes of players not seen for a year
function cleanupBox() {
  const res = el('div', { class: 'small' });
  const year = () => Date.now() - 365 * DAY;
  // a board id -> its date: tour-2026-1-5-b3 (local Monday), 20261105-g0 / B20261016-g0 (UTC day), races/2026-1-5, rankMonth/2026-01
  const idTime = id => {
    let m = /^tour-(\d{4})-(\d{1,2})-(\d{1,2})-/.exec(id) || /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(id);
    if (m) return new Date(+m[1], m[2] - 1, +m[3]).getTime();
    m = /^B?(\d{4})(\d{2})(\d{2})-g/.exec(id);
    if (m) return Date.UTC(+m[1], m[2] - 1, +m[3]);
    m = /^(\d{4})-(\d{2})$/.exec(id);
    return m ? new Date(+m[1], +m[2], 1).getTime() : null; // a month counts from its end
  };
  const KINDS = {
    boards: ['Turnir lövhələri', 'boards', 'entries'], digs: ['Qazma və tikinti yarışları', 'digs', 'players'], races: ['Ölkə yarışı həftələri', 'races', 'players'], rankMonth: ['Aylıq reytinqlər', 'rankMonth', 'players'],
  };
  const scan = async () => {
    clear(res, loading('Sayılır…'));
    const found = [];
    for (const [k, [label, col, sub]] of Object.entries(KINDS)) {
      const parents = await fsListAll(col, { showMissing: true, mask: ['at'] }).catch(() => []);
      const old = parents.filter(p => { const t = idTime(p._id); return t && t < year(); });
      found.push({ k, label, col, sub, old });
    }
    const oldProf = await fsCount('profiles', { where: [W('at', '<', year())] }).catch(() => 0);
    clear(res, el('table', null, el('tbody', null, found.map(f => el('tr', null, el('td', null, f.label), el('td', { class: 'num' }, `${num(f.old.length)} köhnə qrup`))),
      el('tr', null, el('td', null, '1 ildir görünməyən oyunçu profilləri (və poçtları)'), el('td', { class: 'num' }, num(oldProf))))),
    el('div', { class: 'row end' }, busyBtn('Sil', 'danger', async () => {
      const total = found.reduce((a, f) => a + f.old.length, 0) + oldProf;
      if (!total) { toast('Silinəcək heç nə yoxdur'); return; }
      if (!await confirmBox('Köhnə məlumat silinsin?', '12 aydan köhnə lövhə yazıları və 1 ildir görünməyən profillər silinəcək. Geri qaytarmaq olmur (istəsən əvvəl ehtiyat nüsxə yüklə).', { ok: 'Sil', danger: true, typed: 'SİL' })) return;
      let n = 0;
      for (const f of found) for (const p of f.old) {
        const docs = await fsListAll(`${f.col}/${p._id}/${f.sub}`, { mask: ['at'] });
        const w = docs.map(d => del(d._path));
        if (!p._missing) w.push(del(p._path));
        if (w.length) await commit(w, null);
        n += w.length;
        clear(res, `Silinir… ${num(n)}`);
      }
      const profs = await fsQuery('profiles', { where: [W('at', '<', year())], limit: 2000 }).catch(() => []);
      for (const p of profs) {
        const items = await fsList(`inbox/${p._id}/items`, { mask: ['at'] }).catch(() => []);
        await commit([...items.map(d => del(d._path)), del(p._path)], null);
        n += items.length + 1;
        clear(res, `Silinir… ${num(n)}`);
      }
      await logOnly('cleanup', 'firestore', `${n} documents older than 12 months`);
      clear(res, el('span', { class: 'ok' }, `✓ ${num(n)} sənəd silindi`));
    })));
  };
  return el('div', null, el('p', { class: 'small muted' }, 'Məxfilik siyasətində yazılıb: reytinq, yarış və dəvət yazıları 12 ay saxlanılır. Bu düymə 12 aydan köhnə turnir, yarış və aylıq reytinq qruplarını, həmçinin 1 ildir oynamayanların profilini və poçtunu tapır. Əvvəlcə yalnız sayır.'),
    el('div', { class: 'row' }, busyBtn('Say', 'alt', scan)), res);
}

// go to a page (the same page again = draw it again)
function go(view, arg) { const h = '#' + view + (arg ? '/' + encodeURIComponent(arg) : ''); if (location.hash === h) route(); else location.hash = h; }
function route() {
  const [v, a] = location.hash.slice(1).split('/');
  const view = VIEWS[v] ? v : 'home', arg = a ? decodeURIComponent(a) : '';
  current = view;
  for (const x of document.querySelectorAll('#nav a')) x.classList.toggle('on', x.dataset.v === view);
  const n = NAV.find(x => x[0] === view);
  $('topTitle').textContent = n ? n[2] : '';
  document.title = (n ? n[2] + ' · ' : '') + 'Mine Flow İdarə';
  $('app').classList.remove('menu');
  const main = $('main');
  clear(main);
  // changes waiting in Remote Config follow the admin around
  main.append(el('div', { id: 'rcBar', class: 'card sand', hidden: true },
    el('div', { class: 'row' }, el('b', null, '⚙️ Remote Config-də dərc olunmamış dəyişiklik: ', el('span', { id: 'rcBarN' }, '0')), el('span', { class: 'grow' }),
      btn('Bax və dərc et', 'sm', () => go('remote', 'publish')))));
  rcBar();
  const box = el('div');
  main.append(box);
  Promise.resolve().then(() => VIEWS[view](box, arg)).catch(e => { clear(box, el('div', { class: 'card' }, el('h2', null, 'Xəta'), el('p', { class: 'bad' }, errText(e)))); console.error(e); });
  main.focus({ preventScroll: true });

}

// the gate: no client ID yet -> how to make one; else the Google button; the panel opens once a call works
function gate(text, body) { $('gate').hidden = false; $('app').hidden = true; $('gateText').textContent = text; clear($('gateBody'), body || []); }
function askClientId() {
  const i = input('text', '', { placeholder: '1234567890-abc.apps.googleusercontent.com', autocomplete: 'off' });
  gate('Birinci dəfə: Google OAuth "Web client ID" lazımdır (gizli deyil, yalnız bu saytı tanıdır).', [
    el('ol', { class: 'small' },
      el('li', null, 'Google Cloud console › APIs & Services › Credentials › ', el('a', { href: `https://console.cloud.google.com/apis/credentials?project=${PROJECT}`, target: '_blank', rel: 'noopener' }, 'Credentials'), ' aç.'),
      el('li', null, 'Create credentials › OAuth client ID › Application type: Web application.'),
      el('li', null, 'Authorized JavaScript origins: ', el('code', null, location.origin), ' əlavə et › Create.'),
      el('li', null, 'Client ID-ni kopyala və bura yapışdır.')),
    field('Client ID', i),
    btn('Yadda saxla', 'gold', () => { const v = i.value.trim(); if (!/\.apps\.googleusercontent\.com$/.test(v)) { toast('Bu Client ID-yə oxşamır', 'bad'); return; } local.set('clientId', v); start(); }),
  ]);
}
async function start() {
  if (!clientId()) { askClientId(); return; }
  const go1 = async prompt => {
    try {
      await signIn(prompt);
      await opened();
    } catch (e) {
      gate('Giriş alınmadı: ' + errText(e), [btn('Google ilə daxil ol', 'gold', () => go1('select_account')), btn('Client ID-ni dəyiş', 'alt', () => { local.del('clientId'); askClientId(); })]);
    }
  };
  if (AUTH.token && Date.now() < AUTH.exp) { opened().catch(() => go1('')); return; }
  gate('Yalnız layihənin sahibi (Google Cloud-da rolu olan hesab) daxil ola bilər.', [
    btn('Google ilə daxil ol', 'gold', () => go1(local.get('email', '') ? '' : 'consent')),
    el('p', { class: 'tiny muted' }, 'Pəncərə açılmırsa, brauzerdə bu sayt üçün popup-lara icazə ver.'),
  ]);
}
// the first real call decides: a 403 means this Google account has no role in the project
async function opened() {
  gate('Yoxlanılır…');
  try { await fsList('ranking', { pageSize: 1 }); } catch (e) {
    if (e.status === 403 || e.status === 401) { gate(`${AUTH.email || 'Bu hesab'} bu layihəyə buraxılmır: ${e.message}`, [btn('Başqa hesabla daxil ol', 'gold', () => { AUTH.token = null; signIn('select_account').then(opened, fail); })]); return; }
    if (e.status !== 404) toast('Firestore cavab vermədi: ' + errText(e), 'warn', 8000);
  }
  $('gate').hidden = true; $('app').hidden = false;

  route();
  rcLoad().catch(() => {});
}
function boot() {

  start();
}
